aid: oneshield
name: OneShield
description: >-
  OneShield Software provides core insurance platform solutions for property and
  casualty (P&C) insurers, managing general agents (MGAs), program administrators,
  and insurance startups. Its two platforms — OneShield Enterprise, a comprehensive
  cloud/SaaS core suite, and OneShield Market Solutions (OMS), a preconfigured SaaS
  offering — cover policy administration, billing, claims, rating, product
  configuration, relationship management, business intelligence, and analytics
  across more than 90 lines of business. OneShield exposes RESTful and SOAP
  integration services (XML/JSON) through its Services Designer and OMS API
  integration suite, but publishes no public developer portal or OpenAPI; API
  access is provisioned to customers and implementation partners. Headquartered in
  Marlborough, Massachusetts with offices in India, OneShield is backed by
  investors including Bain Capital and Earlybird Venture Capital.
